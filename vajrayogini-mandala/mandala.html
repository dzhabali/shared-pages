import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const DEG = Math.PI / 180;
// Стороны света: восток = +Z (лицом к нему стоит Ваджрайогини), её правая рука — юг (−X).
const dirPos = (deg, r, y = 0) => V(Math.sin(deg * DEG) * r, y, Math.cos(deg * DEG) * r);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- рендер ----------
const mobile = matchMedia('(pointer: coarse)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05030a);
scene.fog = new THREE.FogExp2(0x0a0410, 0.0032);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.03, 4000);
camera.position.set(2.3, 2.4, 4.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.7, 0);
controls.enableDamping = true;
controls.minDistance = 0.8;
controls.maxDistance = 280;
controls.maxPolarAngle = Math.PI - 0.05;   // можно заглянуть и снизу — огонь со всех сторон

scene.add(new THREE.AmbientLight(0x5a3a50, 0.9));
scene.add(new THREE.HemisphereLight(0x8e9cff, 0x3a1406, 0.9));
const sunL = new THREE.DirectionalLight(0xffe2c0, 1.4); sunL.position.set(20, 40, 30); scene.add(sunL);
const deityLight = new THREE.PointLight(0xff4a22, 8, 14, 1.4); deityLight.position.set(0, 2.2, 1.6); scene.add(deityLight);
const palaceLight = new THREE.PointLight(0xff2244, 3, 12, 1.5); palaceLight.position.set(0, 5.5, 0); scene.add(palaceLight);
// отсвет огня и основы снизу — чтобы читались каменные днища островов-кладбищ
const underL = new THREE.PointLight(0xffa070, 70, 90, 1.2); underL.position.set(0, -1, 0); scene.add(underL);

// ---------- общие шейдеры ----------
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;
const FIRE_VS = `varying vec2 vUv; varying vec3 vP; void main(){ vUv=uv; vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
// Пламя: угол вокруг оси → бесшовный шум; uSwirl>0 — языки бегут против часовой (если смотреть сверху), т.е. «закручиваются влево»
const FIRE_FS = NOISE + `
uniform float uTime,uSwirl,uScale,uRise,uIntensity,uMono,uHF,uLean;
varying vec2 vUv; varying vec3 vP;
vec3 pc(float i){ i=mod(i,5.0);
  if(i<0.5) return vec3(1.0,0.96,0.88); if(i<1.5) return vec3(1.0,0.76,0.12);
  if(i<2.5) return vec3(1.0,0.17,0.06); if(i<3.5) return vec3(0.16,0.88,0.38); return vec3(0.18,0.42,1.0); }
vec3 pal(float t){ float x=t*5.0; float i=floor(x); return mix(pc(i),pc(i+1.0),smoothstep(0.55,1.0,fract(x))); }
void main(){
  float a=atan(vP.z,vP.x); float h=vUv.y;
  float ang=a+uTime*uSwirl+h*uLean;
  vec3 q=vec3(cos(ang)*uScale,sin(ang)*uScale,h*uScale*uRise-uTime*1.7);
  float n=snoise(q)*0.55+snoise(q*2.07+vec3(0.0,0.0,-uTime*1.1))*0.3+snoise(q*4.3)*0.15;
  float f=n*0.5+0.5;
  float shape=f*1.75-0.42-pow(h,uHF)*1.1;
  float I=smoothstep(0.1,0.75,shape);
  vec3 col;
  if(uMono>0.5){ col=mix(vec3(1.0,0.1,0.02),vec3(1.0,0.72,0.22),smoothstep(0.35,0.95,shape)); }
  else { col=pal(fract(a/6.2831853*5.0+n*0.4+uTime*0.015)); col=mix(col,vec3(1.0),smoothstep(0.7,1.1,shape)*0.5); }
  gl_FragColor=vec4(col*I*uIntensity,1.0);
}`;
// Огонь сферой вокруг всей мандалы: шум по направлению из центра, языки закручиваются влево; uCut — чем дальше оболочка, тем реже языки
const FIRE_SPH_VS = `varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const FIRE_SPH_FS = NOISE + `
uniform float uTime,uSwirl,uScale,uIntensity,uSeed,uCut;
varying vec3 vP;
vec3 pc(float i){ i=mod(i,5.0);
  if(i<0.5) return vec3(1.0,0.96,0.88); if(i<1.5) return vec3(1.0,0.76,0.12);
  if(i<2.5) return vec3(1.0,0.17,0.06); if(i<3.5) return vec3(0.16,0.88,0.38); return vec3(0.18,0.42,1.0); }
vec3 pal(float t){ float x=t*5.0; float i=floor(x); return mix(pc(i),pc(i+1.0),smoothstep(0.55,1.0,fract(x))); }
void main(){
  vec3 d=normalize(vP); float a=atan(d.z,d.x); float aa=a+uTime*uSwirl; float rr=sqrt(max(1.0-d.y*d.y,0.0));
  vec3 q=vec3(cos(aa)*rr,d.y,sin(aa)*rr)*uScale+vec3(uSeed);
  float n=snoise(q+vec3(0.0,-uTime*0.6,0.0))*0.55+snoise(q*2.07+vec3(uTime*0.5,-uTime*1.1,0.0))*0.3+snoise(q*4.3+vec3(0.0,-uTime*1.6,0.0))*0.15;
  float f=n*0.5+0.5;
  float I=smoothstep(uCut,uCut+0.33,f);
  vec3 col=pal(fract(a/6.2831853*5.0+d.y*0.6+n*0.12+uTime*0.015)); col=mix(col,vec3(1.0),smoothstep(0.8,1.02,f)*0.45);
  gl_FragColor=vec4(col*I*uIntensity,1.0);
}`;
const fireMats = [];
// Языки пламени — конусы от алмазной сферы наружу, каждый своего из пяти цветов, чуть закручены влево
// vSide: насколько язык виден сбоку (с торца конус выглядит шаром — такие гасим)
const TONGUE_VS = `varying vec2 vUv; varying vec3 vP; varying float vS; varying float vSide;
void main(){ vUv=uv; vP=position; vec4 p=vec4(position,1.0); vec4 ax=vec4(0.0,1.0,0.0,0.0);
#ifdef USE_INSTANCING
  p=instanceMatrix*p; ax=instanceMatrix*ax; vS=fract(sin(dot(instanceMatrix[3].xyz,vec3(12.9898,78.233,37.719)))*43758.5453);
#else
  vS=0.0;
#endif
  vec4 mv=modelViewMatrix*p; vec3 a=normalize((modelViewMatrix*ax).xyz);
  vSide=length(cross(a,normalize(mv.xyz)));
  gl_Position=projectionMatrix*mv; }`;
const TONGUE_FS = NOISE + `
uniform float uTime,uIntensity; varying vec2 vUv; varying vec3 vP; varying float vS; varying float vSide;
vec3 pc(float i){ i=mod(i,5.0);
  if(i<0.5) return vec3(1.0,0.96,0.88); if(i<1.5) return vec3(1.0,0.76,0.12);
  if(i<2.5) return vec3(1.0,0.17,0.06); if(i<3.5) return vec3(0.16,0.88,0.38); return vec3(0.18,0.42,1.0); }
void main(){
  float a=atan(vP.z,vP.x); float h=vUv.y;
  vec3 q=vec3(cos(a)*1.8,sin(a)*1.8,h*2.6-uTime*(1.6+vS))+vec3(vS*40.0);
  float n=snoise(q)*0.6+snoise(q*2.1+vec3(0.0,0.0,-uTime))*0.4; float f=n*0.5+0.5;
  float shape=f*1.6-0.25-pow(h,0.85)*1.2; float I=smoothstep(0.05,0.6,shape)*smoothstep(0.0,0.22,h)*smoothstep(0.35,0.8,vSide);
  vec3 col=pc(floor(vS*5.0)); col=mix(col,vec3(1.0),smoothstep(0.5,0.95,shape)*0.5);
  gl_FragColor=vec4(col*I*uIntensity,1.0);
}`;
function fireSph(o) {
  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uSwirl: { value: o.swirl }, uScale: { value: o.scale }, uIntensity: { value: o.intensity }, uSeed: { value: o.seed }, uCut: { value: o.cut } },
    vertexShader: FIRE_SPH_VS, fragmentShader: FIRE_SPH_FS, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
  fireMats.push(m);
  return m;
}
function fireMat(o = {}) {
  const m = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 }, uSwirl: { value: o.swirl ?? 0.12 }, uScale: { value: o.scale ?? 3 }, uRise: { value: o.rise ?? 1 },
      uIntensity: { value: o.intensity ?? 1 }, uMono: { value: o.mono ? 1 : 0 }, uHF: { value: o.hf ?? 1 }, uLean: { value: o.lean ?? 0.5 },
    },
    vertexShader: FIRE_VS, fragmentShader: FIRE_FS, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
  fireMats.push(m);
  return m;
}
// «Тело из света»: цвет + ореол по краю (френель), свет — в пространстве камеры
const LB_VS = `varying vec3 vN; varying vec3 vV; void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); vN=normalize(normalMatrix*normal); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`;
const LB_FS = `uniform vec3 uColor; uniform vec3 uRim; uniform float uGlow; varying vec3 vN; varying vec3 vV;
void main(){ vec3 n=normalize(vN); if(!gl_FrontFacing) n=-n; float d=max(dot(n,normalize(vec3(0.35,0.75,0.55))),0.0);
  float fr=pow(1.0-max(dot(n,vV),0.0),2.0); gl_FragColor=vec4(uColor*(0.5+0.6*d)+uRim*fr*uGlow,1.0); }`;
const lbMat = (c, r, g) => new THREE.ShaderMaterial({ uniforms: { uColor: { value: new THREE.Color(...c) }, uRim: { value: new THREE.Color(...r) }, uGlow: { value: g } }, vertexShader: LB_VS, fragmentShader: LB_FS });

const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, ...o });
const boneM = std(0xeee2c4, { emissive: 0x2c2416, roughness: 0.55 });
const goldM = std(0xe0b04a, { metalness: 0.85, roughness: 0.28, emissive: 0x2a1a00 });
const silverM = std(0xdfe3ea, { metalness: 0.9, roughness: 0.22 });

function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function drawVajra(c, x, y, L, ang, col, lw) {
  c.save(); c.translate(x, y); c.rotate(ang); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = lw; c.lineCap = 'round';
  c.beginPath(); c.arc(0, 0, L * 0.07, 0, 7); c.fill();
  for (const s of [1, -1]) {
    c.beginPath(); c.ellipse(0, s * L * 0.13, L * 0.075, L * 0.05, 0, 0, 7); c.stroke();
    const b = s * L * 0.18, t = s * L * 0.5;
    c.beginPath(); c.moveTo(0, b); c.lineTo(0, t); c.stroke();
    for (const k of [1, -1]) {
      c.beginPath(); c.moveTo(0, b); c.quadraticCurveTo(k * L * 0.22, s * L * 0.3, 0, t); c.stroke();
      c.beginPath(); c.moveTo(0, b); c.quadraticCurveTo(k * L * 0.12, s * L * 0.34, 0, t); c.stroke();
    }
  }
  c.restore();
}
const crossVajra = (c, x, y, L, a, col, lw) => { drawVajra(c, x, y, L, a, col, lw); drawVajra(c, x, y, L, a + Math.PI / 2, col, lw); };

// ---------- звёзды ----------
{
  const n = 4000, p = new Float32Array(n * 3), r = rng(7);
  for (let i = 0; i < n; i++) {
    const u = r() * 2 - 1, th = r() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    p.set([Math.cos(th) * s * 1500, Math.abs(u) * 1500 - 100, Math.sin(th) * s * 1500], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xd8d0ff, size: 1.5, sizeAttenuation: false, fog: false })));
}

// ---------- 1–2. Алмазная основа, стены, крыша и потолок ----------
// Всё из ваджр без промежутков: плитка, где концы скрещённых ваджр смыкаются с соседними, — мелкий сплошной узор, полупрозрачный
const R_WALL = 52;
const ISL = 7;   // уровень кладбищ — верх источников дхармы
{
  const tile = canvasTex(256, 256, (c, w, h) => {
    c.clearRect(0, 0, w, h);
    const gold = 'rgba(232,192,96,1)', blue = 'rgba(130,170,255,1)';
    crossVajra(c, 128, 128, 256, 0, gold, 7);                     // концы упираются в соседние плитки
    crossVajra(c, 128, 128, 170, Math.PI / 4, blue, 5);
    for (const [x, y] of [[0, 0], [256, 0], [0, 256], [256, 256]]) crossVajra(c, x, y, 180, Math.PI / 4, gold, 6);
    for (const [x, y] of [[64, 64], [192, 64], [64, 192], [192, 192]]) drawVajra(c, x, y, 64, (x - 128) * (y - 128) > 0 ? -Math.PI / 4 : Math.PI / 4, blue, 4);

let mode = 'orbit', fly = null, yaw = Math.PI, pitch = 0.04;
window.__look = (y, p) => { yaw = y; pitch = p; };

function flyTo(pos, tgt, dur = 2.4, done) {
  fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: tgt.clone(), s: performance.now(), d: dur * 1000, done };
  controls.enabled = false;
}
function setFP(on) {
  fpHidden.forEach(o => o.visible = !on);
  camera.fov = on ? 78 : 55; camera.updateProjectionMatrix();
  labels.forEach(l => l.visible = !on);
}
function setMode(m) {
  if (mode === 'fp' && m !== 'fp') { setFP(false); camera.position.copy(EYE).add(V(0.3, 0.15, 1.6)); controls.target.set(0, 1.7, 0); }
  mode = m;
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  hint.textContent = HINTS[m];
  card.hidden = m !== 'tour';
  if (m === 'orbit') flyTo(V(2.3, 2.4, 4.6), V(0, 1.7, 0), 2);
  if (m === 'top') flyTo(V(0, 160, 0.01), V(0, 0, 0), 2.4);
  if (m === 'tour') showStep(0);
  if (m === 'fp') {
    flyTo(EYE.clone().add(V(0, 0.02, 0.02)), EYE.clone().add(V(0, 0.04, 1)), 1.6, () => {
      setFP(true); yaw = Math.PI; pitch = 0.04; controls.enabled = false;
      pride.style.opacity = 1; setTimeout(() => pride.style.opacity = 0, 3200);
    });
  }
}
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.m));

// взгляд «её глазами»: тянем — оглядываемся
{
  let drag = null;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => { if (mode !== 'fp') return; drag = { x: e.clientX, y: e.clientY }; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => {
    if (mode !== 'fp' || !drag) return;
    const k = (mobile ? 0.006 : 0.0045) * camera.fov / 78;
    yaw -= (e.clientX - drag.x) * k; pitch -= (e.clientY - drag.y) * k;
    pitch = Math.max(-1.5, Math.min(1.5, pitch)); drag = { x: e.clientX, y: e.clientY };
  });
  el.addEventListener('pointerup', () => drag = null);
  el.addEventListener('pointercancel', () => drag = null);
  el.addEventListener('wheel', e => { if (mode !== 'fp') return; camera.fov = Math.max(40, Math.min(105, camera.fov + e.deltaY * 0.05)); camera.updateProjectionMatrix(); }, { passive: true });
}

// ---------- тур: снаружи к центру (цитаты — Кхен Ринпоче, йога 6) ----------

let step = 0;
const esc = s => s.replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));
function showStep(i) {
  step = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[step];
  document.getElementById('ct').textContent = s.t;
  document.getElementById('cn').textContent = `${step + 1} / ${STEPS.length}`;
  document.getElementById('cq').innerHTML = s.q.map(p => `<p>«${esc(p.replace(/^«|»$/g, ''))}»</p>`).join('');
  document.getElementById('cc').textContent = (s.c ? s.c + ' ' : '') + '— Сермей Кхенсур Лобсанг Тарчин Ринпоче (Кхен Ринпоче), «Высший путь» (Sublime Path to Kechara Paradise), йога 6';
  document.getElementById('prev').disabled = step === 0;
  const nx = document.getElementById('next');
  nx.textContent = s.last ? 'войти — её глазами' : 'дальше →'; nx.classList.toggle('go', !!s.last);
  flyTo(s.pos, s.tgt, step === 0 ? 2.2 : 3);
}
document.getElementById('prev').onclick = () => showStep(step - 1);
document.getElementById('next').onclick = () => STEPS[step].last ? setMode('fp') : showStep(step + 1);
addEventListener('keydown', e => {
  if (mode === 'tour' && e.key === 'ArrowRight') document.getElementById('next').click();
  if (mode === 'tour' && e.key === 'ArrowLeft') showStep(step - 1);
});

// ---------- цикл ----------
const clock = new THREE.Clock();
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  fireMats.forEach(m => m.uniforms.uTime.value = t);
  gakyils.forEach(g => g.rotation.z += dt * 0.6);
  window.__tongues.rotation.y += dt * FIRE_SPIN;
  window.__hang.rotation.z = Math.sin(t * 1.3) * 0.08; window.__hang.rotation.x = Math.sin(t * 0.9) * 0.06;
  deityLight.intensity = 7 + Math.sin(t * 7) * 0.6 + Math.sin(t * 13) * 0.4;
  for (const b of bolts) {
    if (b.m.visible) { b.t -= dt; b.m.material.opacity = Math.random() < 0.3 ? 0.4 : 1; if (b.t <= 0) b.m.visible = false; }
    else if (Math.random() < dt * 0.45) strike(b);
  }
  if (fly) {
    const k = Math.min(1, (performance.now() - fly.s) / fly.d), e = ease(k);
    camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0, fly.t1, e);
    camera.lookAt(controls.target);
    if (k >= 1) { const d = fly.done; fly = null; if (mode !== 'fp') controls.enabled = true; d && d(); }
  } else if (mode === 'fp') {
    camera.position.copy(EYE); camera.rotation.order = 'YXZ'; camera.rotation.set(pitch, yaw, 0);
  } else controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
document.getElementById('load').remove();
hint.textContent = HINTS.orbit;
frame();
